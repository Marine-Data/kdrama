<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4e8">
<title>Freestyle Tricks – Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4e8; --card:#ffffff; --ink:#1f2a44; --muted:#6b7490;
  --accent:#ff5a4e; --accent-ink:#ffffff; --sun:#ffc94a; --mint:#2fb89a;
  --line:#1f2a44; --soft:#ffe6cf;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  padding:max(16px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));line-height:1.45}
main{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif}
header{padding:12px 0 18px}
h1{font-size:2.1rem;font-weight:800;line-height:1.05;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:6px}
.who{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:.92rem;color:var(--muted)}
.who button{all:unset;cursor:pointer;font-weight:600;color:var(--ink);border-bottom:2px solid var(--sun)}
.btn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:14px;padding:12px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--line);
  transition:transform .08s, box-shadow .08s;min-height:46px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-size:1.05rem;margin:12px 0 8px}
.btn.in{background:var(--mint);color:#fff}
.btn.small{padding:8px 12px;min-height:40px;font-size:.9rem}
.day{margin-top:26px}
.day h2{font-size:1.05rem;font-weight:700;text-transform:capitalize;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.day h2 .today{background:var(--sun);border:2px solid var(--line);border-radius:99px;font-size:.7rem;padding:1px 8px;text-transform:none;font-family:Inter}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 14px 14px;margin-bottom:12px;box-shadow:4px 4px 0 var(--line)}
.card.me{background:#f1fffb}
.time{display:inline-block;background:var(--soft);border-radius:8px;padding:2px 9px;font-weight:700;font-size:.85rem}
.card h3{font-size:1.2rem;font-weight:800;margin:8px 0 2px;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
.meta a{color:inherit;text-decoration-color:var(--sun);text-decoration-thickness:2px}
.desc{margin-top:8px;font-size:.93rem;white-space:pre-line}
.people{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{background:var(--soft);border-radius:99px;padding:3px 10px;font-size:.85rem;font-weight:500}
.chip.me{background:var(--mint);color:#fff;font-weight:600}
.none{color:var(--muted);font-size:.88rem;font-style:italic}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.row .btn{flex:1}
.del{all:unset;cursor:pointer;color:var(--muted);font-size:.82rem;text-decoration:underline;padding:8px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
details.past{margin-top:30px}
details.past summary{cursor:pointer;color:var(--muted);font-weight:600;padding:8px 0}
details.past .card{opacity:.6;box-shadow:none}
/* dialog */
dialog{border:2px solid var(--line);border-radius:22px;padding:20px;width:min(520px,calc(100vw - 24px));background:var(--bg);color:var(--ink);box-shadow:6px 6px 0 var(--line)}
dialog::backdrop{background:rgba(31,42,68,.45)}
dialog h2{font-size:1.4rem;font-weight:800;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
input,textarea{font:inherit;width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg button{font:inherit;font-size:.82rem;border:2px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;cursor:pointer}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.err{color:#b3261e;font-size:.88rem;margin-top:10px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Freestyle <span>Tricks</span> 🤸‍♀️</h1>
    <p class="sub">Propose une activité ou inscris-toi à celles des autres.</p>
    <div class="who" id="who"></div>
  </header>

  <button class="btn primary big" id="addBtn">+ Proposer une activité</button>
  <div id="list" aria-live="polite"></div>
</main>

<!-- Prénom -->
<dialog id="nameDlg">
  <form method="dialog" id="nameForm">
    <h2>C'est quoi ton prénom ?</h2>
    <p class="meta">Juste pour que les autres voient qui vient. Pas de compte à créer.</p>
    <label for="nameInput">Prénom</label>
    <input id="nameInput" maxlength="40" autocomplete="given-name" required>
    <div class="actions">
      <button class="btn" type="button" id="nameCancel">Annuler</button>
      <button class="btn primary" type="submit">C'est parti</button>
    </div>
  </form>
</dialog>

<!-- Nouvelle activité -->
<dialog id="addDlg">
  <form id="addForm">
    <h2>Proposer une activité</h2>
    <label for="fTitre">Quoi ?</label>
    <input id="fTitre" maxlength="120" placeholder="Ex : Natation, running, street workout…" required>
    <div class="sugg" id="sugg"></div>
    <div class="two">
      <div><label for="fDate">Quand ?</label><input type="date" id="fDate" required></div>
      <div><label for="fHeure">À quelle heure ?</label><input type="time" id="fHeure"></div>
    </div>
    <label for="fLieu">Où ?</label>
    <input id="fLieu" maxlength="200" placeholder="Adresse ou nom du lieu">
    <label for="fDesc">Détails (optionnel)</label>
    <textarea id="fDesc" maxlength="600" placeholder="Niveau, matériel, programme…"></textarea>
    <p class="err" id="addErr" role="alert"></p>
    <div class="actions">
      <button class="btn" type="button" id="addCancel">Annuler</button>
      <button class="btn primary" type="submit" id="addSubmit">Publier</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const SB = 'https://osqyczwawbbwjwaubtvc.supabase.co/rest/v1';
const KEY = 'sb_publishable_Z4ykq9R8uYhtrAks301TPA_ujR1K2VB';
const H = {apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json'};

let activities = [];
let me = '';
try { me = localStorage.getItem('ft_prenom') || ''; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.trim().toLowerCase();

async function api(path, opts = {}) {
  const r = await fetch(SB + path, {...opts, headers: {...H, ...(opts.headers || {})}});
  if (!r.ok) { const t = await r.text(); const e = new Error(t || r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json().catch(() => null);
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dayLabel(s) {
  const d = new Date(s + 'T12:00:00');
  return new Intl.DateTimeFormat('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'}).format(d);
}
const hm = t => t ? t.slice(0, 5).replace(':', 'h') : '';
function timeLabel(a) {
  if (!a.heure) return 'Horaire à confirmer';
  return hm(a.heure) + (a.duree_fin ? ' → ' + hm(a.duree_fin) : '');
}

async function load() {
  try {
    activities = await api('/ft_activites?select=*,ft_inscriptions(id,prenom,created_at)&order=date.asc,heure.asc.nullslast');
    render();
  } catch (e) {
    $('list').innerHTML = '<div class="empty">Impossible de charger le planning. Réessaie dans un instant.</div>';
  }
}

function card(a) {
  const ins = (a.ft_inscriptions || []).slice().sort((x, y) => x.created_at.localeCompare(y.created_at));
  const mine = me && ins.find(i => norm(i.prenom) === norm(me));
  const people = ins.length
    ? ins.map(i => `<span class="chip ${me && norm(i.prenom) === norm(me) ? 'me' : ''}">${esc(i.prenom)}</span>`).join('')
    : '<span class="none">Personne pour l’instant, sois le premier·ère !</span>';
  const lieu = a.lieu
    ? `<div class="meta">📍 <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.lieu)}" target="_blank" rel="noopener">${esc(a.lieu)}</a></div>` : '';
  const canDel = me && norm(a.organisateur) === norm(me);
  return `<article class="card ${mine ? 'me' : ''}">
    <span class="time">${esc(timeLabel(a))}</span>
    <h3>${esc(a.titre)}</h3>
    ${lieu}
    <div class="meta">Proposé par ${esc(a.organisateur)}</div>
    ${a.description ? `<p class="desc">${esc(a.description)}</p>` : ''}
    <div class="people">${people}</div>
    <div class="row">
      <button class="btn small ${mine ? '' : 'in'}" data-act="${mine ? 'leave' : 'join'}" data-id="${a.id}">${mine ? 'Je ne viens plus' : '✋ Je viens'}</button>
      ${canDel ? `<button class="del" data-act="del" data-id="${a.id}">Supprimer</button>` : ''}
    </div>
  </article>`;
}

function render() {
  const today = todayStr();
  const upcoming = activities.filter(a => a.date >= today);
  const past = activities.filter(a => a.date < today).reverse();
  let html = '';
  if (!upcoming.length) html += '<div class="empty">Rien de prévu pour le moment.<br>Lance-toi, propose la première activité ! 💪</div>';
  const byDay = {};
  upcoming.forEach(a => (byDay[a.date] = byDay[a.date] || []).push(a));
  Object.keys(byDay).sort().forEach(d => {
    html += `<section class="day"><h2>${esc(dayLabel(d))}${d === today ? '<span class="today">aujourd’hui</span>' : ''}</h2>${byDay[d].map(card).join('')}</section>`;
  });
  if (past.length) html += `<details class="past"><summary>Activités passées (${past.length})</summary>${past.map(card).join('')}</details>`;
  $('list').innerHTML = html;
  $('who').innerHTML = me ? `Tu es <button id="chg" title="Changer de prénom">${esc(me)} ✎</button>` : '';
  const chg = $('chg'); if (chg) chg.onclick = () => askName();
}

function askName() {
  return new Promise(res => {
    const dlg = $('nameDlg'), inp = $('nameInput');
    inp.value = me; dlg.showModal(); inp.focus();
    const done = v => { dlg.close(); $('nameForm').onsubmit = null; $('nameCancel').onclick = null; res(v); };
    $('nameForm').onsubmit = e => {
      e.preventDefault();
      const v = inp.value.trim(); if (!v) return;
      me = v; try { localStorage.setItem('ft_prenom', v); } catch (e) {}
      done(v);
    };
    $('nameCancel').onclick = () => done('');
    dlg.addEventListener('cancel', () => res(''), {once: true});
  });
}
async function ensureName() { return me || (await askName()); }

$('list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (!(await ensureName())) return;
  b.disabled = true;
  try {
    if (act === 'join') {
      await api('/ft_inscriptions', {method: 'POST', body: JSON.stringify({activite_id: id, prenom: me}), headers: {Prefer: 'return=minimal'}});
      toast('C’est noté, à bientôt ! 🎉');
    } else if (act === 'leave') {
      const a = activities.find(x => x.id === id);
      const i = a.ft_inscriptions.find(x => norm(x.prenom) === norm(me));
      if (i) await api('/ft_inscriptions?id=eq.' + i.id, {method: 'DELETE'});
      toast('Inscription retirée');
    } else if (act === 'del') {
      if (!confirm('Supprimer cette activité pour tout le monde ?')) { b.disabled = false; return; }
      await api('/ft_activites?id=eq.' + id, {method: 'DELETE'});
      toast('Activité supprimée');
    }
  } catch (err) {
    if (err.status !== 409) toast('Oups, ça n’a pas marché. Réessaie.');
  }
  load();
});

/* Ajout */
const SUGGS = ['Natation 🏊', 'Running 🏃', 'Street workout 💪', 'Salle de sport', 'Yoga 🧘', 'Gym suédoise', 'Escalade 🧗'];
$('sugg').innerHTML = SUGGS.map(s => `<button type="button">${esc(s)}</button>`).join('');
$('sugg').onclick = e => { const b = e.target.closest('button'); if (b) { $('fTitre').value = b.textContent; $('fTitre').focus(); } };

$('addBtn').onclick = async () => {
  if (!(await ensureName())) return;
  $('addForm').reset(); $('fDate').min = todayStr(); $('fDate').value = todayStr(); $('addErr').textContent = '';
  $('addDlg').showModal();
};
$('addCancel').onclick = () => $('addDlg').close();
$('addForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('addSubmit'); btn.disabled = true; $('addErr').textContent = '';
  const body = {
    titre: $('fTitre').value.trim(), date: $('fDate').value, heure: $('fHeure').value || null,
    lieu: $('fLieu').value.trim() || null, description: $('fDesc').value.trim() || null, organisateur: me
  };
  try {
    const [row] = await api('/ft_activites', {method: 'POST', body: JSON.stringify(body), headers: {Prefer: 'return=representation'}});
    // le créateur est inscrit d'office
    await api('/ft_inscriptions', {method: 'POST', body: JSON.stringify({activite_id: row.id, prenom: me}), headers: {Prefer: 'return=minimal'}});
    $('addDlg').close(); toast('Activité publiée 🙌'); load();
  } catch (err) {
    $('addErr').textContent = 'Impossible de publier pour le moment. Réessaie.';
  }
  btn.disabled = false;
};

load();
setInterval(() => { if (!document.hidden && !document.querySelector('dialog[open]')) load(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
